# Weekly Deno/JSR dependency bumps — the JSR half of the two dependency
# channels README.md documents (Issue #646). `upgrade-dependencies.yml` keeps
# Cargo current through `bump-deps.sh`; this keeps `deno.json` / `deno.lock`
# current through Deno's own updater, on the same Monday slot.
name: Deno Dependency Updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-outdated:
    name: Update Deno dependencies and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15 # resolve + verify only; no cargo build in this lane
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the update PR
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        # The credential stays on disk here: create-pull-request below pushes
        # the update branch from this working tree.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: Develop

      - name: Install Deno
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          # Exact, as in ci.yml / markdown-lint.yml / wasm-bundle.yml: a
          # floating `v2.x` would change the updater underneath the bump it
          # proposes. Bump this alongside the other three.
          deno-version: "2.9.3"

      - name: Refresh Deno dependencies (quarantine-aware)
        shell: bash
        run: |
          set -euo pipefail
          # The supply-chain quarantine is native Deno tooling, never a
          # hand-rolled age gate here: `minimumDependencyAge` in deno.json holds
          # external jsr:/npm: releases for P1D (24h, the
          # VIBE_BUMP_QUARANTINE_HOURS default) and excludes the internal
          # jsr:@stsoftware/* and npm:@stsoftware/* scopes, which update at 0h.
          #
          # --frozen=false is load-bearing. deno.json marks the lockfile frozen,
          # and without it the update rewrites deno.json and then refuses to
          # write deno.lock — leaving a tree whose every Deno gate fails with
          # "lockfile is out of date" while this step still exits 0.
          deno outdated --update --latest --minimum-dependency-age=P1D \
            --frozen=false 2>&1 | tee deno-outdated.log
          # Fail loud rather than open a red PR: the refreshed lockfile must
          # satisfy the frozen gate the repository commits.
          deno install --frozen=true

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- deno.json deno.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Deno dependency changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- deno.json deno.lock
          fi

      - name: Build summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'body<<EOF'
            echo '## Deno dependency updates'
            echo ''
            echo 'Applied with `deno outdated --update --latest`, so every'
            echo 'external release has cleared the `minimumDependencyAge`'
            echo 'quarantine in `deno.json` (P1D); internal `@stsoftware/*`'
            echo 'scopes are excluded and update immediately.'
            echo ''
            echo 'The refreshed `deno.lock` was verified against the frozen'
            echo 'gate (`deno install --frozen=true`) before this PR was opened.'
            echo ''
            echo '### deno outdated log'
            echo '```'
            cat deno-outdated.log
            echo '```'
            echo ''
            echo 'This PR was automatically generated by the scheduled Deno dependency update workflow.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        # peter-evans/create-pull-request@v7.0.11
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          # Authenticate with the org-level PAT so the created PR fires its
          # downstream workflows (CI, labels, reviewer automation). A bare
          # GITHUB_TOKEN makes GitHub suppress those triggers (Issue #168).
          # Fall back to GITHUB_TOKEN only when ACTIONS_PUSH is unset.
          token: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          branch: chore/deno-outdated
          base: Develop
          title: "chore: update Deno dependencies"
          body: ${{ steps.summary.outputs.body }}
          commit-message: "chore: update Deno dependencies"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          delete-branch: true
          # The run's log is a PR-body artefact, not a tracked file.
          add-paths: |
            deno.json
            deno.lock
