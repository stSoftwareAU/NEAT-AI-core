name: Semgrep

on:
  pull_request:
    # Issue #330 — GitHub branch-filter globs treat `*` as "any chars except
    # /", so a bare "*" never matches milestone/<slug> feature branches. Add an
    # explicit "milestone/*" pattern so this scan runs on milestone sub-issue
    # PRs too, not just the single rollup PR into the default branch.
    branches: ["*", "milestone/*"]

# Issue #334 — one live SAST scan per branch. Each run pulls the semgrep
# container before scanning, so stacked runs are expensive as well as redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Issue #335 — a bare image name resolves to the mutable `:latest` tag, which
  # the registry owner (or anyone who compromises that account) can re-point at
  # any time; the new image would then run with this job's GITHUB_TOKEN,
  # SEMGREP_APP_TOKEN and checked-out source. Pin by digest so the image is
  # immutable, same as `uses:` SHA pins (Issue #77).
  # semgrep/semgrep:1.170.1 — `:latest` as of 2026-07. Refresh with
  # `docker buildx imagetools inspect semgrep/semgrep:latest`.
  SEMGREP_IMAGE: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
  # PR #468 — fallback path when Docker Hub itself is unreachable. Must track
  # the version the digest above pins, so both paths scan with the same semgrep.
  SEMGREP_VERSION: 1.170.1

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # container pull + full SAST scan
    # PR #393 — this job used a job-level `container:`. The runner pulls that
    # image during "Initialize containers", before any step runs, with a fixed
    # 3 attempts ~3s apart and no way to tune them. A Docker Hub outage there
    # (`Get "https://registry-1.docker.io/v2/": context deadline exceeded`)
    # fails the whole job without ever invoking semgrep, and reports as a SAST
    # failure. Pulling explicitly in a step keeps the immutable digest pin but
    # puts the backoff under our control.
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # PR #468 — retries alone cannot survive a Docker Hub outage: all five
      # attempts hit `Get "https://registry-1.docker.io/v2/": context deadline
      # exceeded` and the job failed without semgrep ever running. Docker Hub is
      # a single point of failure for this gate, so fall back to the PyPI
      # release (different infrastructure) at the same version. The container
      # remains the primary, digest-pinned path; the fallback is version-pinned
      # and only reachable once the pinned image is provably unavailable.
      - name: Obtain semgrep
        id: obtain
        run: |
          set -euo pipefail
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if docker pull "$SEMGREP_IMAGE"; then
              echo "Pulled $SEMGREP_IMAGE on attempt $attempt."
              echo "mode=docker" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              backoff=$((attempt * 15))
              echo "docker pull failed (attempt $attempt/$attempts); retrying in ${backoff}s."
              sleep "$backoff"
            fi
          done
          echo "::warning::Could not pull $SEMGREP_IMAGE after $attempts attempts; falling back to semgrep $SEMGREP_VERSION from PyPI."
          # Fail loud — if neither source yields a scanner, the job fails rather
          # than reporting a pass for a scan that never ran.
          if ! pipx install "semgrep==${SEMGREP_VERSION}"; then
            echo "::error::Neither the pinned container nor PyPI provided semgrep, so no SAST scan ran."
            exit 1
          fi
          echo "mode=pypi" >> "$GITHUB_OUTPUT"

      - name: Semgrep scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_MODE: ${{ steps.obtain.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SEMGREP_MODE" = "docker" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/src" \
              -w /src \
              -e SEMGREP_APP_TOKEN \
              "$SEMGREP_IMAGE" \
              sh -c 'git config --global --add safe.directory /src && semgrep ci --config p/default'
          else
            semgrep ci --config p/default
          fi
