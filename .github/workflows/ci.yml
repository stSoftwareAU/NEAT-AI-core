# NEAT-AI-Discovery–style PR pipeline: auto patch version + rustfmt push, then strict checks.
# Requires the org-level secret ACTIONS_PUSH (PAT with contents:write) so bots can push to PR
# branches; default GITHUB_TOKEN alone is often insufficient. Issue #483 — this repository holds
# no Actions secrets of its own, so ACTIONS_PUSH resolves from the organisation and its blast
# radius is org-wide. It is therefore handed only to the single step that pushes, never persisted
# into .git/config while PR-authored code (bump-deps.sh, cargo fmt) runs.
name: CI

on:
  push:
    branches:
      - Develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Issue #327 — milestone sub-issue PRs target a shared milestone/<slug>
      # branch; `*` never crosses `/`, so this single-level glob gates them too.
      - milestone/*
  workflow_dispatch:

# Issue #334 — the heaviest gate in the repo: one run compiles the workspace
# several times over (quality + rust-gates). Every `synchronize` push to an open
# PR — including the bot pushes from `version-increment`/`auto-format` — queued
# a fresh run on top of one still compiling, so a few rapid pushes stacked runs
# several deep. Keying the group on the workflow *and* the ref keeps one live
# run per branch and cancels the superseded ones, whose results nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version-increment:
    name: Auto-increment Versions
    runs-on: ubuntu-latest
    timeout-minutes: 15 # version bump + push
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #483 — no PAT here and `persist-credentials: false`, so nothing
        # writes ACTIONS_PUSH into .git/config. This job later executes
        # `./bump-deps.sh` from the PR head; a persisted credential would be
        # readable by that PR-authored code for the whole job. The repo is
        # public, so the default GITHUB_TOKEN clones and `git pull` works
        # anonymously — only the final push needs the PAT.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git pull origin "$HEAD_REF"

      - name: Fetch base branch
        run: |
          set -euo pipefail
          git fetch origin Develop:Develop || git fetch origin develop:develop || true

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install cargo-audit and cargo-outdated
        # cargo-audit is required by bump-deps.sh; cargo-outdated is used for the
        # informational report below. cargo-edit is intentionally dropped — the
        # dep refresh now goes through bump-deps.sh (cargo update), not
        # cargo upgrade, so cargo-edit is no longer needed.
        # taiki-e/install-action@v2.79.2
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d
        with:
          tool: cargo-audit,cargo-outdated

      - name: Bump crate version (if needed) and upgrade dependencies
        # PR_BREAKING_LABEL is the boolean result of a controlled GitHub
        # expression (not user text), so it is safe to read from the env.
        env:
          PR_BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
          # Issue #76 — crates.io versions younger than this many hours are
          # deferred by bump-deps.sh so this PR bump path honours the same
          # release-age quarantine as the scheduled upgrade-dependencies.yml.
          VIBE_BUMP_QUARANTINE_HOURS: ${{ vars.VIBE_BUMP_QUARANTINE_HOURS || '24' }}
        run: |
          set -euo pipefail
          BASE_BRANCH="Develop"
          if ! git show-ref --verify --quiet refs/remotes/origin/Develop; then
            BASE_BRANCH="develop"
          fi

          SKIP_VERSION_BUMP=false
          if git show-ref --verify --quiet refs/remotes/origin/$BASE_BRANCH; then
            VERSION_COMMIT_COUNT=$(git log --oneline origin/$BASE_BRANCH..HEAD --grep="chore: auto-increment versions for changed projects" | wc -l | tr -d ' ')
            if [ "${VERSION_COMMIT_COUNT:-0}" -gt 0 ]; then
              echo "Version bump commit already on this PR — skipping semver bump only"
              SKIP_VERSION_BUMP=true
            fi
          fi

          if [ "$SKIP_VERSION_BUMP" = false ] && git show-ref --verify --quiet refs/remotes/origin/$BASE_BRANCH; then
            BASE_VERSION=$(git show origin/$BASE_BRANCH:Cargo.toml 2>/dev/null | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/' || echo "")
            CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            # Skip only when HEAD is *ahead* of the base version. A milestone
            # feature branch can sit behind Develop; skipping there left the PR
            # on a downgrade that the version gate below then rejected.
            chmod +x scripts/check-version-bump.sh
            if [ -n "$BASE_VERSION" ] && [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$BASE_VERSION" ] &&
              scripts/check-version-bump.sh "$BASE_VERSION" "$CURRENT_VERSION" false >/dev/null 2>&1; then
              echo "Version already ahead of base — skipping semver bump"
              SKIP_VERSION_BUMP=true
            fi
          fi

          if [ "$SKIP_VERSION_BUMP" = false ]; then
            CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            echo "Current crate version: $CURRENT_VERSION"

            # Issue #251: a breaking change is a major-equivalent bump (pre-1.0:
            # minor), a non-breaking change a patch bump. Detect the breaking
            # signal from the `breaking-change` PR label or Conventional Commit
            # markers (`type!:` subject, or a `BREAKING CHANGE:` footer).
            BREAKING=false
            if [ "${PR_BREAKING_LABEL:-false}" = "true" ]; then
              BREAKING=true
            fi
            if git show-ref --verify --quiet refs/remotes/origin/$BASE_BRANCH; then
              RANGE="origin/$BASE_BRANCH..HEAD"
            else
              RANGE="HEAD"
            fi
            chmod +x scripts/detect-breaking.sh scripts/next-version.sh
            if [ "$(scripts/detect-breaking.sh "$RANGE")" = "true" ]; then
              BREAKING=true
            fi
            echo "Breaking change signalled: $BREAKING"

            # Bump from whichever is higher — this branch's version or the base
            # branch's — so a branch lagging Develop lands above it, not below.
            BUMP_FROM="$CURRENT_VERSION"
            if [ -n "${BASE_VERSION:-}" ] &&
              ! scripts/check-version-bump.sh "$BASE_VERSION" "$CURRENT_VERSION" false >/dev/null 2>&1; then
              echo "Version $CURRENT_VERSION is behind base $BASE_VERSION — bumping from base"
              BUMP_FROM="$BASE_VERSION"
            fi
            NEW_VERSION=$(scripts/next-version.sh "$BUMP_FROM" "$BREAKING")
            echo "Bumping crate version to: $NEW_VERSION"
            ESCAPED_CURRENT=$(printf '%s' "$CURRENT_VERSION" | sed 's/[\/.^$*+?()[\]{}|]/\\&/g')
            sed -i.bak "s/^version = \"$ESCAPED_CURRENT\"/version = \"$NEW_VERSION\"/" Cargo.toml
            rm -f Cargo.toml.bak
          fi

          # Refresh crates.io dependencies through bump-deps.sh so the
          # release-age quarantine (Issue #76) is honoured on the PR bump path
          # too. A direct upgrade/update here would bypass the quarantine and
          # re-open the fast-flagged supply-chain window the script closes.
          # --skip-build: the downstream quality / rust-gates jobs already
          # compile the bumped tree; cargo audit still runs here for an early
          # advisory signal.
          echo "Refreshing dependencies via bump-deps.sh (quarantine-aware)..."
          chmod +x bump-deps.sh
          ./bump-deps.sh --quarantine-hours "${VIBE_BUMP_QUARANTINE_HOURS}" --skip-build
          cargo outdated -R || true

      - name: Commit version and dependency changes
        # Issue #483 — the PAT is supplied just-in-time to this one step and
        # pushed through an explicit remote URL, so it never touches disk.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after version bump / dependency upgrade"
          else
            git commit -m "chore: auto-increment versions for changed projects"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          fi

  # Issue #251 — fail a PR whose breaking change ships on a patch-only bump.
  # Runs after version-increment so it validates the final (post auto-bump)
  # version. Keys off the same breaking signal: the `breaking-change` label or
  # a Conventional Commit marker in the PR's commits.
  version-gate:
    name: Breaking-change version gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # version comparison only
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enforce breaking ⇒ major-equivalent bump
        env:
          PR_BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          set -euo pipefail
          BASE_BRANCH="Develop"
          if ! git show-ref --verify --quiet refs/remotes/origin/Develop; then
            BASE_BRANCH="develop"
          fi
          git fetch origin "$BASE_BRANCH:$BASE_BRANCH" 2>/dev/null || true

          BASE_VERSION=$(git show "origin/$BASE_BRANCH:Cargo.toml" 2>/dev/null | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/' || echo "")
          HEAD_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$BASE_VERSION" ]; then
            echo "Could not read base version — skipping gate."
            exit 0
          fi

          BREAKING=false
          if [ "${PR_BREAKING_LABEL:-false}" = "true" ]; then
            BREAKING=true
          fi
          chmod +x scripts/detect-breaking.sh scripts/check-version-bump.sh
          if [ "$(scripts/detect-breaking.sh "origin/$BASE_BRANCH..HEAD")" = "true" ]; then
            BREAKING=true
          fi
          echo "base=$BASE_VERSION head=$HEAD_VERSION breaking=$BREAKING"
          scripts/check-version-bump.sh "$BASE_VERSION" "$HEAD_VERSION" "$BREAKING"

  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    timeout-minutes: 20 # cargo fmt + push
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #483 — same rule as version-increment: no PAT on the checkout
        # and no persisted credential, because the steps in between run
        # PR-authored content (`cargo fmt` over the PR head). The PAT is
        # supplied only to the push step below.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure bash scripts are executable
        run: |
          set -euo pipefail
          CHANGED=false
          while IFS= read -r script; do
            if [ ! -x "$script" ]; then
              chmod +x "$script"
              CHANGED=true
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ "$CHANGED" = true ]; then
            echo "chmod +x applied to scripts"
          fi

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Format code
        run: cargo fmt --all

      - name: Commit rustfmt if needed
        id: fmt_commit
        env:
          HEAD_REF: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: apply rustfmt fixes"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45 # cargo build + clippy + tests + docs
    if: github.event_name == 'pull_request'
    needs: [version-increment, auto-format]
    # Issue #309 — least-privilege GITHUB_TOKEN. This job only reads the repo
    # (checkout, git pull, cargo deny/fmt/clippy/test/doc); it never pushes, so
    # it must not inherit the repository's broad default write scopes.
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git pull origin "$HEAD_REF"

      - name: Free up runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          df -h /

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Rust cache
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"

      - name: Install cargo-deny
        # taiki-e/install-action@v2.79.2
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy compiles the workspace; skip redundant cargo check / cargo build here.
      - name: Run linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --lib --tests --all-features -- --test-threads=2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  rust-gates:
    name: Lint & Compile Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45 # cargo fmt/clippy/check across the workspace
    # Issue #143 — explicit Rust lint + compile/syntax gates. Deliberately
    # independent of the PR-only auto-bump / auto-format jobs above, so direct
    # pushes to Develop (which skip those jobs) are still gated against lint
    # regressions and syntax errors.
    # Issue #337 — on pull requests the `quality` job already runs the identical
    # clippy invocation (which compiles the workspace, subsuming `cargo check`),
    # so running this job there compiled and linted the workspace twice per PR
    # in separate jobs with separate caches. Scope it to the events `quality`
    # does not cover; `quality` stays the comprehensive PR gate.
    if: github.event_name != 'pull_request'
    # Issue #310 — least privilege: this job only checks out and compiles/lints
    # the repo, so read-only contents is all the GITHUB_TOKEN needs.
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #318 — `persist-credentials: false` keeps the workflow
        # GITHUB_TOKEN out of .git/config. This job only compiles and lints;
        # it never pushes back and fetches no private submodule, so the
        # persisted credential would only widen the blast radius of a
        # compromised later step.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy

      - name: Rust cache
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"

      # Compile/syntax gate — fail the build on syntax or type errors across
      # every target before the slower lint pass runs.
      - name: Compile gate (cargo check)
        run: cargo check --workspace --all-targets --all-features

      # Lint gate — clippy with -D warnings so lint regressions fail the build.
      - name: Lint gate (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Issue #307 — TypeScript basic-validity gate. Runs on every push to Develop
  # AND every pull request (no PR-only guard), so a syntax or type error in the
  # committed .ts helpers cannot land unnoticed. Basic validity only — this is
  # not a style or lint gate. The same script backs the local quality.sh run.
  typescript-gate:
    name: TypeScript validity gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # deno check over committed .ts helpers
    # Issue #482 — least-privilege GITHUB_TOKEN. This job only reads the repo
    # (checkout, install Deno, deno check); it never writes.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #477 — this job only type-checks committed .ts helpers and
        # never touches the remote, so the persisted GITHUB_TOKEN would be
        # pure blast radius (same rule as rust-gates/validation).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Issue #482 — keep the workflow token out of .git/config; nothing in
          # this read-only job pushes back.
          persist-credentials: false

      - name: Install Deno
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.3"

      - name: Type-check TypeScript sources (deno check)
        run: |
          set -euo pipefail
          chmod +x scripts/typescript-check.sh
          ./scripts/typescript-check.sh

  scripts-and-spelling:
    name: Scripts & spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15 # shellcheck + bats + codespell
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # Issue #311 — least-privilege GITHUB_TOKEN. This job only reads the repo
    # (checkout, shellcheck, bash -n, codespell); it never pushes, so it must
    # not inherit the repository's broad default write scopes.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      # ShellCheck Lint — upstream project: https://github.com/koalaman/shellcheck
      # We install the apt package (which ships koalaman/shellcheck) and scan all *.sh files
      # under the repository, mirroring the local quality.sh gate.
      - name: Install shellcheck (koalaman/shellcheck)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck (koalaman/shellcheck)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r script; do
            shellcheck -s bash "$script" || failed=1
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit "$failed"

      - name: Check bash script syntax (bash -n)
        run: |
          set -euo pipefail
          exit_code=0
          while IFS= read -r script; do
            bash -n "$script" || exit_code=1
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit "$exit_code"

      # Bash helper tests (bats) — mirrors the local quality.sh gate so that
      # public-safety regressions (e.g. Issue #397: perf sources naming the
      # private trainer's internal scripts) fail on the PR rather than only on
      # a contributor's machine.
      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get install -y bats
          bats --version

      - name: Run bats (tests/scripts)
        run: bats tests/scripts

      - name: Run codespell
        # codespell-project/actions-codespell@v2.2
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579
        with:
          check_filenames: true
          check_hidden: true
          skip: "./target,./.git"
          ignore_words_list: renderD,mape

  # Issue #297 — wasm64 lane (b) Memory64 runtime guard. The committed smoke
  # test instantiates a minimal `(memory i64 ...)` module, grows linear memory
  # past the wasm32 4 GiB ceiling, and round-trips a BigInt (64-bit) pointer
  # across the JS↔WASM boundary. A Deno/V8 upgrade that drops or breaks Wasm 3.0
  # Memory64 support fails HERE, in CI, rather than being rediscovered mid-port.
  wasm64-memory64-smoke:
    name: wasm64 Memory64 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10 # single deno smoke test
    # Issue #331 — least-privilege GITHUB_TOKEN. This job only reads the repo
    # (checkout, install Deno, run one committed smoke test); it never writes,
    # so it must not inherit the repository's broad default write scopes.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #332 — `persist-credentials: false` keeps the workflow
        # GITHUB_TOKEN out of .git/config. This job only reads the repo
        # (install Deno, run one committed smoke test); it never pushes back
        # and fetches no private submodule, so leaving the credential on disk
        # would only widen the blast radius of a compromised step.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Deno
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.3"

      # Issue #541 — the same job also runs the *shipped-bundle* gate unit tests
      # (memory-type and export-surface checks, and the numeric-parity fixture
      # and comparator). Those need no nightly build, so they belong on every
      # PR; the end-to-end check against the real artefact runs in
      # wasm-bundle.yml, which is the only place a built pkg/ exists.
      - name: Run Memory64 smoke and bundle-gate tests
        run: |
          deno test \
            tests/wasm64_memory64_smoke_test.ts \
            tests/wasm64_bundle_gate_test.ts \
            tests/wasm_arch_parity_test.ts < /dev/null

  security:
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # Issue #312 — least-privilege GITHUB_TOKEN. A reusable-workflow caller with
    # no permissions block hands the called workflow the repository's broad
    # default scopes. Grant only what security.yml needs: read the repo
    # (checkout, cargo audit) plus the dependency-review PR comment summary.
    permissions:
      contents: read
      pull-requests: write
    with:
      include-dependency-review: true

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15 # cargo metadata + manifest/doc checks
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # Issue #313 — least-privilege GITHUB_TOKEN. This job only reads the repo
    # (checkout, cargo metadata, manifest/README/rustdoc file checks); it never
    # writes, so it must not inherit the repository's broad default scopes.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        # Issue #320 — `persist-credentials: false` keeps the workflow
        # GITHUB_TOKEN out of .git/config. This job only reads the repo
        # (manifest, README and rustdoc checks); it never pushes back and
        # fetches no private submodule, so the persisted credential would only
        # widen the blast radius of a compromised later step.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Check for required files
        run: |
          set -euo pipefail
          required_files=(
            "Cargo.toml"
            "README.md"
            "LICENSE"
            "neat-core/src/lib.rs"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing: $file"
              exit 1
            fi
          done

      - name: Validate Cargo workspace manifest
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Validate workspace.package in root Cargo.toml
        run: |
          set -euo pipefail
          # Read the uncommented manifest once: under `pipefail` a
          # `grep ... | grep -q ...` pipeline can report the first grep's
          # SIGPIPE instead of the match, so match against a here-string.
          uncommented=$(grep -vE '^[[:space:]]*#' Cargo.toml)
          for field in version edition license; do
            if ! grep -qE "^[[:space:]]*${field}[[:space:]]*=" <<< "$uncommented"; then
              echo "Missing workspace.package field '${field}' in root Cargo.toml"
              exit 1
            fi
          done
          grep -qE '^\[workspace\]' Cargo.toml || { echo "Missing [workspace]"; exit 1; }
          grep -q 'members' Cargo.toml || { echo "Missing workspace members"; exit 1; }

      - name: Validate neat-core Cargo.toml
        run: |
          set -euo pipefail
          # See the workspace check above: match against a here-string so
          # `pipefail` cannot turn a successful `grep -q` into a SIGPIPE.
          uncommented=$(grep -vE '^[[:space:]]*#' neat-core/Cargo.toml)
          for field in name version edition license; do
            if ! grep -qE "^[[:space:]]*${field}" <<< "$uncommented"; then
              echo "Missing '${field}' in neat-core/Cargo.toml"
              exit 1
            fi
          done

      - name: Check README length
        run: |
          set -euo pipefail
          readme_lines=$(wc -l < README.md)
          if [ "$readme_lines" -lt 10 ]; then
            echo "README.md too short ($readme_lines lines)"
            exit 1
          fi

      - name: Check neat-core rustdoc presence
        run: |
          set -euo pipefail
          doc_comments=$(grep -c "///" neat-core/src/lib.rs || echo "0")
          if [ "$doc_comments" -eq 0 ]; then
            echo "No /// in neat-core/src/lib.rs"
            exit 1
          fi

