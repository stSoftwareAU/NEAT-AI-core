# Weekly Cargo version-updates channel (Issue #121, corrected in Issue #500).
#
# The quarantine-aware `upgrade-dependencies.yml` cron is the authoritative
# routine bump path; this file adds a second, overlapping weekly channel with a
# 7-day cooldown. Dependabot *security* updates (the advisory-triggered fast
# lane) are a repository-level setting, not something this file configures —
# see https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/about-dependabot-security-updates
# Advisory detection lives in `security.yml` / `ci.yml` (cargo audit).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      # Routine version bumps stay weekly to mirror upgrade-dependencies.yml.
      interval: "weekly"
    # Semgrep package_managers.dependabot.dependabot-missing-cooldown — wait
    # before proposing version bumps of newly published crates so supply-chain
    # compromise has time to surface. Cooldown applies to version updates only;
    # repository-level security updates are not affected by it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
