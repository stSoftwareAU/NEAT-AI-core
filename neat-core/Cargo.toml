[package]
name = "neat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared computation library for NEAT-AI neural network operations. Optional wasm-bindgen on wasm32 only."

[lints]
workspace = true

# Issue #36 - cdylib added for wasm-pack; rlib retained so native consumers
# (rust_scorer, CLI tools, native tests) continue to link as before.
[lib]
crate-type = ["cdylib", "rlib"]

# Native builds omit wasm-bindgen; WASM targets link it for `accumulate` exports.
[dependencies]
serde = { version = "1", features = ["derive"] }
# NEAT-AI#3747 - `raw_value` lets the creature's `memetic` block round trip as
# the exact source bytes (key order and number formatting intact) instead of
# being re-ordered by `serde_json::Value`'s sorted map.
serde_json = { version = "1", features = ["raw_value"] }

# Issue #179 - opt-in data-parallel record scoring. `rayon` is native-only
# (it is not wasm-friendly), so it is declared under a `cfg(not(wasm32))`
# target table. The `parallel` feature is off by default, so default and
# `wasm32` builds pull in no rayon symbols and keep their single-thread path.
[features]
parallel = ["dep:rayon"]

# Issue #509 - off by default: restores the bounds-checked wasm32 `gather4`.
# The shipped default elides those checks under the load-time
# `InvalidSynapseIndex` validation (measured 19-24% on the isolated kernel and
# 2-3% end-to-end; see `docs/research/wasm-gather4-unchecked-loads.md`). This
# feature is the A/B control the harness measures against and the one-flag way
# back out.
checked-gather4 = []

# Issue #541 - keyed on the wasm *family*, not `wasm32`. A
# `wasm64-unknown-unknown` build reports `target_arch = "wasm64"`, so the
# previous `wasm32` tables silently dropped wasm-bindgen and silently pulled
# rayon into a wasm64 build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = { version = "1.12", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.127"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

# Issue #152 - opt-in Criterion harness for core hot paths. `harness = false`
# keeps these out of `cargo test`/CI so `quality.sh` runtime is unaffected;
# run explicitly with `cargo bench -p neat-core`.
[[bench]]
name = "hot_paths"
harness = false

# Issue #179 - data-parallel scoring throughput (records/sec at 1 vs all cores).
# Requires `--features parallel`; without it the bench's `main` is a no-op shim.
[[bench]]
name = "parallel_scoring"
harness = false

# Issue #510 - inference throughput across a sweep of aggregate-squash
# frequencies on the production_exact creature. Its `agg0pct` point is a null
# control (no aggregate neurons), so its spread measures host noise.
[[bench]]
name = "aggregate_frequency"
harness = false
