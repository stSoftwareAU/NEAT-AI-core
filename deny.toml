# cargo-deny — same policy family as NEAT-AI-Discovery.
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check

[graph]
targets = []
all-features = true

[licenses]
# Same broad allow-list as Discovery; quiet "license not encountered" noise on small graphs.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Issue #676 — orphan containment for the `winapi ← page_size ← criterion`
# chain. `winapi` is unmaintained (0.3.9, 2020-06-26; superseded by
# `windows-sys`) and is not a choice made here: criterion 0.8.x declares
# `page_size ^0.6` as a plain non-optional dependency, and every published
# page_size release depends on `winapi`. Neither edge is removable from this
# manifest, so the exposure is *bounded* instead — these wrappers fail
# `cargo deny check bans` the moment a second path appears, which is the only
# way a dev-only, Windows-only crate could reach the shipped library or the wasm
# bundle. Delete both entries once criterion drops page_size, or page_size
# migrates to `windows-sys`; `tests/cargo_orphan_containment_test.ts` is what
# reports the shape changing.
# Issue #677 — the same containment for `tinytemplate` (1.2.1, 2021-03-04;
# "Project dead?" and an unanswered CVE report still open upstream), which
# criterion renders its local HTML benchmark reports with. criterion 0.8.2
# declares it non-optional and its `html_reports` feature carries an empty
# feature list, so turning that feature off drops the reports without dropping
# the crate. Delete this entry once criterion makes the dependency optional or
# drops it.
deny = [
    { crate = "winapi", wrappers = ["page_size"] },
    { crate = "page_size", wrappers = ["criterion"] },
    { crate = "tinytemplate", wrappers = ["criterion"] },
]
wildcards = "allow"
highlight = "lowest-version"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
