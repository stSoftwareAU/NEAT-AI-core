# Virtual workspace: shared native Rust (`neat-core`). WASM stays in NEAT-AI.
[workspace]
members = ["neat-core"]
# Issue #509 - research-only WASM benchmark harness; excluded so the shipped
# crate set (and therefore `quality.sh`, the version bump and `cargo deny`)
# is unchanged.
exclude = ["wasm-bench"]
resolver = "2"

[workspace.package]
# Issue #251: retro-bumped 0.1.46 -> 0.2.0 to signal the #177 breaking change
# (SynapseData::from_index u32 -> u16). Pre-1.0, a breaking change is a
# major-equivalent (minor) bump. See RELEASING.md.
version = "0.11.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/stSoftwareAU/NEAT-AI-core"

# Issue #546 (fleet decision stSoftwareAU/VibeCoding#4159): dev builds compile
# as fast as possible. `line-tables-only` keeps panic/backtrace file:line and
# drops the rest of the DWARF; `opt-level = 0` and incremental stay at cargo's
# dev defaults. Stable Rust only — no nightly flags.
[profile.dev]
debug = "line-tables-only"

# Release builds produce the most optimised artefact possible; compile time is
# irrelevant. Declared workspace-wide, not scoped to one package. No
# `target-cpu=native` here: the wasm bundles and downstream consumers must stay
# portable, and a library's profiles never reach a consumer anyway — each binary
# crate carries its own (see README "Build profiles").
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3

# Issue #165 - enforce a deny floor at the crate root so CI fails fast when a
# contributor introduces a bare `unsafe` op inside an `unsafe fn`. `neat-core`
# carries raw-SIMD intrinsics (AVX2/FMA/NEON) with `get_unchecked` indexing, so
# every unsafe operation must sit in an explicit `unsafe { … }` block.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Issue #209 - require a `///` summary on every exported item so the public
# API surface stays documented on docs.rs. Promote to "deny" once stable.
missing_docs = "warn"

[workspace.lints.clippy]
collapsible_if = "deny"
filter_next = "deny"
doc_nested_refdefs = "allow"
identity_op = "allow"
manual_is_multiple_of = "allow"
manual_memcpy = "allow"
missing_const_for_thread_local = "allow"
needless_late_init = "allow"
needless_range_loop = "allow"
neg_multiply = "allow"
same_item_push = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
